<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}FCast{% endblock %} · FCast</title>
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li><strong>FCast</strong> <small class="muted">{{ platform_label }}</small></li>
      </ul>
      <ul>
        <li><a href="/prices" {% if nav == "prices" %}aria-current="page"{% endif %}>Übersicht</a></li>
        <li><a href="/signals" {% if nav == "signals" %}aria-current="page"{% endif %}>Signale</a></li>
        <li><a href="/watchlist" {% if nav == "watchlist" %}aria-current="page"{% endif %}>Watchlist</a></li>
        <li><a href="/status" {% if nav == "status" %}aria-current="page"{% endif %}>Status</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container">
    <small class="muted">FCast {{ version }} · Kaufen und verkaufen immer manuell.</small>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
